<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Shrimponi — The Don of Seafood</title>
    <meta name="description" content="Shrimponi — fried & grilled seafood done the family way. Order dine-in or delivery." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      /* Inlined so it paints instantly, before the app's CSS/JS has loaded. */
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0d1a33;
        transition: opacity 0.4s ease;
      }
      #initial-loader.loader-hide {
        opacity: 0;
        pointer-events: none;
      }
      #initial-loader .loader-ring {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #f97316;
        animation: loader-spin 0.8s linear infinite;
      }
      #initial-loader .loader-word {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-weight: 700;
        letter-spacing: 0.14em;
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.8);
      }
      @keyframes loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="loader-ring"></div>
      <span class="loader-word">SHRIMPONI</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
